# d3mon-kde mpv: sane defaults + OSD in d3mon colours.
# Keep machine-specific options in a profile or on the command line;
# re-running the installer backs this file up before replacing it.

# Video
profile=high-quality
vo=gpu-next
hwdec=auto-safe
video-sync=display-resample
interpolation=no

# Window
keep-open=yes
save-position-on-quit=yes
autofit-larger=90%x90%
cursor-autohide=1000
force-window=immediate

# Audio
volume=80
volume-max=150
audio-file-auto=fuzzy
alang=eng,en,jpn,ja

# Subtitles
sub-auto=fuzzy
slang=eng,en
sub-font="Noto Sans"
sub-font-size=44
sub-color="#ECEEE9"
sub-border-color="#0A0A0B"
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color="#80000000"
sub-margin-y=36

# OSD (d3mon: near-black, light ink, green accent)
osd-font="JetBrainsMono Nerd Font"
osd-font-size=28
osd-color="#ECEEE9"
osd-border-color="#0A0A0B"
osd-border-size=2
osd-shadow-offset=0
osd-back-color="#D90D0D0E"
osd-bar-align-y=0.9
osd-bar-h=2
osd-bar-w=70
osd-duration=1500
osd-playing-msg="${media-title}"
osd-playing-msg-duration=2000
osd-fractions=no

# Screenshots
screenshot-format=png
screenshot-directory=~/Pictures/Screenshots
screenshot-template="mpv-%F-%P"

# On-screen controller in d3mon colours (osc colour options: mpv 0.40+)
script-opts-append=osc-seekbarstyle=bar
script-opts-append=osc-scalewindowed=1.1
script-opts-append=osc-hidetimeout=800
script-opts-append="osc-background_color=#0A0A0B"
script-opts-append="osc-buttons_color=#ECEEE9"
script-opts-append="osc-small_buttonsL_color=#C6C9C3"
script-opts-append="osc-top_buttons_color=#C6C9C3"
script-opts-append="osc-title_color=#ECEEE9"
script-opts-append="osc-timecode_color=#91E611"
script-opts-append="osc-time_pos_color=#ECEEE9"
script-opts-append="osc-held_element_color=#8A8D88"
