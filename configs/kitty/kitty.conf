# d3mon-kde kitty: d3mon theme on KDE Plasma (KWin).
#
# Colours live in dark-theme.auto.conf / light-theme.auto.conf next to
# this file. kitty (0.38+) picks the one matching Plasma's light/dark
# setting and switches live when it changes. The colours below are
# only a dark fallback for older kitty.

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures cursor

# Glass: KWin blurs behind translucent windows.
background_opacity         0.92
background_blur            1
dynamic_background_opacity yes
window_padding_width       10 12

# Let KWin draw the titlebar (d3mon window decoration).
hide_window_decorations    no
confirm_os_window_close    0
remember_window_size       yes
initial_window_width       100c
initial_window_height      30c

# Cursor + bell
cursor_shape          beam
cursor_blink_interval 0.6
enable_audio_bell     no
visual_bell_duration  0

# Links
url_style   single
detect_urls yes

# Tabs (colours come from the theme files)
tab_bar_edge          top
tab_bar_style         separator
tab_separator         "  "
tab_title_template    " {index} {title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# Fallback colours (d3mon dark)
foreground           #eceee9
background           #0a0a0b
selection_foreground #0b1400
selection_background #91e611
cursor               #91e611
cursor_text_color    #0b1400
url_color            #91e611

allow_remote_control no

# Machine-specific tweaks go in local.conf (optional, not managed;
# globinclude stays silent when it is missing).
globinclude local.conf
